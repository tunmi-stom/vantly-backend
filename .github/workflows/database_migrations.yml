name: Database Migrations and Deployment

on:
  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  development:
    name: Development Migration and Deployment

    if: github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    concurrency:
      group: vantly-development-migrations
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.DEVELOPMENT_DATABASE_URL }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Database Configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Development database URL is missing."
            exit 1
          fi

      - name: Apply Development Migrations
        run: |
          alembic upgrade head

      - name: Deploy Development Backend
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEVELOPMENT_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$DEPLOY_HOOK"


  production:
    name: Production Migration and Deployment

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    concurrency:
      group: vantly-production-migrations
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Database Configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Production database URL is missing."
            exit 1
          fi

      - name: Apply Production Migrations
        run: |
          alembic upgrade head

      - name: Deploy Production Backend
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$DEPLOY_HOOK"